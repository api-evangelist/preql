name: Preql
description: 'Preql (preql.ai) is an enterprise data platform that automates data cleaning,
  reconciliation, and semantic modeling to deliver the trustworthy context layer that AI
  agents and business analytics depend on. Its agentic platform combines Agentic Semantic
  Modeling, Data Cleaning Agents, and AI-Powered Reporting to automatically resolve data
  mismatches, schema drift, and anomalies across ERP, CRM, HR, and expense systems without
  manual intervention, serving finance, operations, revenue, and executive decision-making
  at large enterprises. The company was surfaced as a portfolio company of Bessemer Venture
  Partners and Felicis, and added to the API Evangelist network. Preql does not currently
  publish a public developer API, developer portal, or API reference; this profile captures
  its public company identity, help center, and web properties.'
